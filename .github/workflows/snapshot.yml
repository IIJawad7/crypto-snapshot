name: Crypto snapshot

on:
  workflow_dispatch:          # "Run workflow" button (web or GitHub mobile app)
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (keeps the dashboard fresh)

permissions:
  contents: write             # needed to commit the report back to the repo

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build snapshot
        run: python snapshot.py

      - name: Keep only the last 200 history files
        run: ls -1t reports/history/*.md 2>/dev/null | tail -n +201 | xargs -r rm --

      - name: Commit report
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet
          git push
